<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Demolition Derby: Multi-Vehicle Edition</title>
   
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Home Screen Overlay with Vehicle Selector -->
    <div id="startScreen">
        <div id="startTitle">3D DEMOLITION DERBY</div>
        <div id="startSub">Multi-Vehicle Edition</div>
       
        <div id="selectorContainer">
            <label style="font-size: 11px; color: #aaa; margin-bottom: 5px;">SELECT YOUR VEHICLE:</label>
            <select id="vehicleSelect">
                <option value="yukon">2001 GMC Yukon (Balanced SUV)</option>
                <option value="camry">2013 Toyota Camry (Fast & Agile Sedan)</option>
                <option value="ram">2012 Dodge Ram (Heavy Tank Truck)</option>
            </select>
        </div>

        <button id="startButton">START GAME</button>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdownScreen" style="display: none;">5</div>

    <!-- Full-Screen Result Pop-up Overlay -->
    <div id="resultScreen" style="display: none;">
        <div id="resultText">VICTORY!</div>
        <button id="homeButton">HOME SCREEN</button>
    </div>

    <div id="gameContainer">
        <canvas id="webglCanvas"></canvas>
       
        <!-- Live Matchup Indicator at Top -->
        <div id="matchupHud">
            <span id="playerMatchupText" style="color: #3498db;">YOU: Yukon</span> vs <span id="aiMatchupText" style="color: #e74c3c;">AI: Camry</span>
        </div>

        <!-- Graphical Component Damage HUD -->
        <div id="hud">
            <div id="hudTitle">VEHICLE STATUS</div>
            <div id="carHudGraphic">
                <div id="hud-fl" class="hud-wheel"></div>
                <div id="hud-fr" class="hud-wheel"></div>
                <div id="hud-engine">ENG</div>
                <div id="hud-body">BODY</div>
                <div id="hud-rl" class="hud-wheel"></div>
                <div id="hud-rr" class="hud-wheel"></div>
            </div>
        </div>
    </div>

    <div id="wheelContainer">
        <div id="wheelKnob"></div>
    </div>

    <div id="ui">Destroy the AI opponent before it wrecks you!</div>

    <script src="game.js"></script>
</body>
</html>
